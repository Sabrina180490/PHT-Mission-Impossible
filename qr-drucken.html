<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QR-Codes drucken – Mission Impossible</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f4f7fb;color:#243047}header{text-align:center;padding:24px 10px}h1{margin:0;font-size:30px}p{margin:8px}.sheet{max-width:1050px;margin:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:14px}.card{background:white;border:5px solid var(--color);border-radius:22px;text-align:center;padding:22px 10px;break-inside:avoid}.card h2{font-size:22px;min-height:60px}.card .emoji{font-size:55px}.card img{width:90%;max-width:250px;image-rendering:pixelated}.card p{font-size:15px;font-weight:700}.tools{text-align:center;margin:10px}.tools button{padding:13px 25px;background:#243047;color:#fff;border:0;border-radius:10px;font-size:17px;cursor:pointer}@media(max-width:680px){.sheet{grid-template-columns:1fr;max-width:380px}}@media print{@page{size:A4 landscape;margin:10mm}body{background:#fff;print-color-adjust:exact;-webkit-print-color-adjust:exact}header{padding:6px}.sheet{grid-template-columns:repeat(3,1fr);gap:8px;padding:0}.card{padding:10px 5px}.card img{width:80%}.tools{display:none}}</style></head><body><header><h1>🎯 MISSION IMPOSSIBLE · PHT</h1><p>QR-Codes ausschneiden und im Turnsaal verteilen</p></header><div class="tools"><button onclick="window.print()">🖨️ Drucken / als PDF speichern</button></div><main class="sheet"><section class="card" style="--color:#ffcf4b"><div class="emoji">🧠</div><h2>STATION 1<br>Gehirn gegen Beine</h2><img src="qr-station1.png" alt="QR-Code Station 1"><p>📱 SCAN MICH!</p></section><section class="card" style="--color:#a6dd78"><div class="emoji">🪢</div><h2>STATION 2<br>Menschlicher Knoten</h2><img src="qr-station2.png" alt="QR-Code Station 2"><p>📱 SCAN MICH!</p></section><section class="card" style="--color:#7ec9f5"><div class="emoji">🌋</div><h2>STATION 3<br>Boden ist Lava</h2><img src="qr-station3.png" alt="QR-Code Station 3"><p>📱 SCAN MICH!</p></section></main></body></html>
